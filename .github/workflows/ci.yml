name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only deps
        run: |
          pip install -U pip setuptools wheel
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
          pip install --no-deps --no-build-isolation -e .
          pip install pytest
      - name: Run tests
        run: PYTHONPATH=src pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tcga-pancancer-set-transformer:latest
      - name: Smoke test the published image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/tcga-pancancer-set-transformer:latest
          docker run -d --name dash -p 7860:7860 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7860/ > /dev/null; then
              echo "dashboard is up after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          docker logs dash
          exit 1
