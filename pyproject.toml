[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcga-bench"
version = "0.1.0"
description = "Self-supervised, permutation-equivariant, uncertainty-aware representation learning on large-scale high-dimensional tabular data."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.2",
    "numpy",
    "pandas",
    "scikit-learn",
    "umap-learn",
    "plotly",
    "einops",
    "omegaconf",
    "gradio",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
